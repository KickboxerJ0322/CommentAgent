<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="YouTubeコメントから人々の声を横断調査するAIエージェント">
  <title>CommentAgent — YouTube Research AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><a class="brand" href="/"><span class="logo">C</span> CommentAgent</a><span class="badge">AI RESEARCH AGENT</span></header>
  <main>
    <section class="hero">
      <p class="eyebrow">YOUTUBEの「みんなの声」を、AIが調べる。</p>
      <h1>知りたいことを入力するだけ。<br><span>調査はエージェントに。</span></h1>
      <p class="lead">動画を探し、コメントを読み、情報不足なら追加調査。複数動画に散らばる視聴者の反応を一つのレポートにまとめます。</p>
      <form id="research-form">
        <label for="topic">調査テーマ</label>
        <div class="searchbox">
          <div class="input-wrap"><input id="topic" maxlength="200" required placeholder="例：生成AIで仕事はどう変わる？"><button id="clear-topic" class="clear-button hidden" type="button" aria-label="入力を消去">×</button></div>
          <button class="submit-button" type="submit">調査を開始 <span>→</span></button>
        </div>
        <label class="check"><input id="additional" type="checkbox" checked> 情報不足を検出した場合、追加調査を許可する</label>
      </form>
      <div class="examples"><span>TRY</span><button>iPhoneの新機能への反応</button><button>生成AIによる仕事への影響</button><button>最近の電気自動車の評判</button></div>
    </section>

    <section id="history" class="history-shell hidden">
      <div class="history-head"><div><p class="eyebrow">RESEARCH HISTORY</p><h2>過去の調査</h2></div><button id="clear-history" type="button">履歴を消去</button></div>
      <div id="history-list" class="history-list"></div>
    </section>

    <section id="workspace" class="workspace hidden" aria-live="polite">
      <aside class="activity"><div class="panel-title"><span>●</span> AGENT ACTIVITY</div><div id="activity-list"></div></aside>
      <article class="report">
        <div id="loading" class="loading"><div class="orb"></div><h2>エージェントが調査中です</h2><p>検索・収集・分析には少し時間がかかります。</p></div>
        <div id="result" class="hidden"></div>
      </article>
    </section>
  </main>
  <footer>Powered by Google Cloud · Gemini · YouTube Data API</footer>
  <script src="/app.js" type="module"></script>
</body>
</html>
